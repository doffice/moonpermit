name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Pinned toolchain (minimum moonc 0.10.14)
        run: moon version --all
      - name: Check
        run: moon check --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Format
        run: moon fmt --check
      - name: Public API drift
        shell: bash
        run: |
          moon info
          git diff --exit-code
      - name: Build
        run: moon build
      - name: CLI smoke test
        run: moon run cmd/main
      - name: CLI compile
        run: moon run cmd/main -- compile ci --calls 2 read-tree:docs
      - name: CLI check
        run: moon run cmd/main -- check --calls 1 --repeat 2 read-tree:docs read:docs/guide.md
      - name: CLI explain
        run: moon run cmd/main -- explain --calls 2 --bytes 10 --cost 4 read-tree:docs read:docs/guide.md
      - name: CLI delegate
        run: moon run cmd/main -- delegate --parent-calls 2 --child-calls 1 read-tree:docs read:docs/guide.md
      - name: CLI diff
        run: moon run cmd/main -- diff read-tree:docs read:.env
      - name: CLI audit
        run: moon run cmd/main -- audit
      - name: Embedding example
        run: moon run examples/basic
      - name: Guarded host integration
        run: moon run examples/guarded_host

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Pinned toolchain (minimum moonc 0.10.14)
        run: moon version --all
      - name: Coverage tests
        run: moon test --enable-coverage --deny-warn
      - name: Coverage summary
        run: moon coverage analyze -- -f summary
      - name: Release benchmarks
        run: moon bench --release --deny-warn
